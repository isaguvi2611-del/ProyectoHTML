<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="voluntariado.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">

</head>

<body>
    <div>
        <h1 id="volun">¿LISTO PARA COLABORAR?</h1>
    </div>
    <div>
        <div>
            <img id="par" src="carrusel/voluntariado.jpg" alt="">
            <div class="clase1">

                <h1>INGRESA TU INFORMACIÓN</h1>
                <form>

                    <label>NOMBRE</label>
                    <input type="text" placeholder="Ingrese un nombre">

                    <label>APELLIDO</label>
                    <input type="text" placeholder="Ingrese un apellido">

                    <label>TELÉFONO</label>
                    <input type="tel" class="telefono" placeholder="Ingrese un teléfono">

                    <label>MONTO A DONAR</label>
                    <input type="number" class="lugar" placeholder="Ingrese un monto">

                    <label>MÉTODO DE PAGO</label>
                    <input type="text" class="metodo" placeholder="Ingrese un método de pago">

                    <label>MENSAJE</label>
                    <input type="text" class="mensaje" placeholder="Ingrese un mensaje">

                    <h3>¿En qué podemos ayudarte?</h3>
                    <label class="opcion">
                        <input type="radio" name="tipo"> Adoptar
                    </label>

                    <label class="opcion">
                        <input type="radio" name="tipo"> Donar
                    </label>

                    <label class="opcion">
                        <input type="radio" name="tipo"> Ser Voluntario
                    </label>

                    <label class="opcion">
                        <input type="radio" name="tipo"> Información
                    </label>
                    <br>
                    <button onclick="window.location.href='gracias.html'">ENVIAR</button>
                </form>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
