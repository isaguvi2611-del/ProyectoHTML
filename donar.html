<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donaciones</title>
    <link rel="stylesheet" href="donar.css">
</head>

<body>
    <section id="navegar">
        <div>
            <div class="izq">
            <a href="pagina.html"><img id="fle" src="img/image-removebg-preview (1).png" alt="flecha izquierda"><a href="pagina.html"></a></a>
            </div>
        </div>
    </section>
    <div class="caja">
        <form>
            <label>NOMBRE</label>
            <input type="text" placeholder="Ingrese un nombre">

            <label>APELLIDO</label>
            <input type="text" placeholder="Ingrese un apellido">

            <label>TELÉFONO</label>
            <input type="tel" placeholder="Ingrese un teléfono">

            <label>MONTO A DONAR</label>
            <input type="number" placeholder="Ingrese un monto">

            <label>MÉTODO DE PAGO</label>
            <input type="text" placeholder="Ingrese un método de pago">

            <label>MENSAJE</label>
            <input type="text" placeholder="Ingrese un mensaje">

            <h3>¿Desea donar anonimamente?</h3>
            <label><input type="radio" name="tipo"> Anonimo</label>
            <button onclick="window.location.href='gracias.html'">ENVIAR</button>
        </form>
    </div>

</body>

</html>
